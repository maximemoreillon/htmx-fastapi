<div class="border rounded p-2">
  <h3 class="font-bold">{{fruit.name}}</h3>
  <p>{{fruit.description}}</p>
  <p>
    <button
      hx-delete="/fruits/{{fruit.id}}"
      hx-target="closest div"
      hx-swap="outerHTML"
      hx-confirm="Are you sure?"
      class="text-red-800 cursor-pointer ml-auto"
    >
      Delete
    </button>
  </p>
</div>
